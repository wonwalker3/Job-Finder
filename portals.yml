# Job-Finder Active Scanner Configuration
# This is the live scanner config.
# Retuned after the first calibration set:
# - Luxury Presence AE: 4.6/5
# - HubSpot SMB AE: 3.8/5
# - Mento GTM Engineer: 2.7/5
#
# Meaning:
# - favor customer-facing commercial roles with technical leverage
# - favor proptech / AI-forward commercial / solutions roles
# - avoid roles that are really GTM engineering / RevOps builder jobs in disguise
#
# Company targeting is split into practical tiers:
# - Tier 1: highest-fit / priority targets
# - Tier 2: Austin/Texas realistic targets
# - Tier 3: remote national targets

title_filter:
  positive:
    - "Account Executive"
    - "Commercial Account Executive"
    - "Mid-Market Account Executive"
    - "Strategic Account Executive"
    - "Enterprise Account Executive"
    - "Solutions Engineer"
    - "Solutions Consultant"
    - "Solutions Architect"
    - "Implementation Manager"
    - "Customer Engineer"
    - "Partnerships"
    - "Business Development"
    - "Product Specialist"
    - "AI"
    - "Automation"
    - "Applied AI"
    - "AI Product"
    - "AI Solutions"
    - "PropTech"
    - "Revenue Operations"
    - "Business Systems"
    - "Internal Tools"
  negative:
    - "Junior"
    - "Intern"
    - "SDR"
    - "BDR"
    - "Sales Development Representative"
    - "Account Development Representative"
    - "RevOps Engineer"
    - "Growth Engineer"
    - "GTM Engineer"
    - "Revenue Engineer"
    - "SQL"
    - "API"
    - "Webhooks"
    - "Data Engineer"
    - "Software Engineer"
    - "Full Stack"
    - "Backend"
    - ".NET"
    - "Java "
    - "iOS"
    - "Android"
    - "Embedded"
    - "Firmware"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Salesforce Admin"
  seniority_boost:
    - "Senior"
    - "Lead"
    - "Principal"
    - "Head"
    - "Director"

search_queries:
  - name: Austin proptech / real-estate tech
    query: 'Austin ("proptech" OR "real estate software") ("Account Executive" OR Solutions OR Implementation)'
    enabled: true

  - name: Texas AI-forward commercial roles
    query: 'Texas ("AI" OR automation) ("Account Executive" OR "Solutions Engineer" OR Implementation)'
    enabled: true

  - name: Remote SaaS AE with customer/process fit
    query: 'site:jobs.ashbyhq.com OR site:job-boards.greenhouse.io OR site:jobs.lever.co "Account Executive" "consultative" Salesforce remote'
    enabled: true

  - name: Remote solutions / implementation roles
    query: 'site:jobs.ashbyhq.com OR site:job-boards.greenhouse.io OR site:jobs.lever.co "Solutions Engineer" OR "Implementation Manager" OR "Customer Engineer" remote'
    enabled: true

  - name: AI commercial / product-adjacent roles
    query: 'site:jobs.ashbyhq.com OR site:job-boards.greenhouse.io OR site:jobs.lever.co "AI" (commercial OR solutions OR "product specialist") remote'
    enabled: true

  - name: Austin / Texas SaaS AEs
    query: '(Austin OR Texas) ("Account Executive" OR "Mid-Market" OR "Enterprise Account Executive") SaaS'
    enabled: true

