# Job-Finder Candidate Profile
# Copy this file to config/profile.yml and fill in the real details.
# This is the main source of truth for candidate identity, targets, and compensation.

candidate:
  full_name: "Your Name"
  email: "you@example.com"
  phone: "+1-555-555-5555"
  location: "Austin, TX"
  linkedin: "linkedin.com/in/yourprofile"
  portfolio_url: "https://your-site.com"
  github: "github.com/yourhandle"

search:
  status: "active"
  urgency: "normal"           # low | normal | high
  preferred_regions:
    - "United States"
  work_preferences:
    remote: true
    hybrid: true
    onsite: false
    travel_ok: "limited"

role_targets:
  primary:
    - "Applied AI / Automation"
    - "Technical Product / AI Product"
    - "Solutions / Implementation"
  secondary:
    - "Revenue / Ops Systems"
    - "Business Operator with Technical Leverage"
  avoid:
    - "Pure quota-carrying sales"
    - "Deep specialist engineering roles with obvious hard-skill gaps"

narrative:
  headline: "Operator-builder who uses systems, automation, and AI to create leverage"
  exit_story: "Looking for roles where practical execution, systems thinking, and technical leverage matter more than posturing."
  differentiators:
    - "Moves fast and ships useful things"
    - "Comfortable across business, product, and systems"
    - "Can turn messy process into cleaner execution"
  proof_points:
    - name: "Project / Win #1"
      url: "https://example.com/proof-1"
      hero_metric: "Quantified outcome here"
    - name: "Project / Win #2"
      url: "https://example.com/proof-2"
      hero_metric: "Quantified outcome here"

compensation:
  target_range: "$140K-$220K"
  minimum_acceptable: "$120K"
  preferred_currency: "USD"
  notes: "Optimize for total opportunity, realistic comp, and role quality."

location:
  country: "United States"
  city: "Austin"
  timezone: "America/Chicago"
  visa_status: "Authorized to work"
  onsite_availability: "Open to selective travel or hybrid if the role is worth it"
