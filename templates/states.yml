# Job-Finder — Canonical States
# Source of truth for tracker-writing flows and dashboard consumers.
# Status field rules:
# - one canonical state only
# - no markdown
# - no dates
# - no extra commentary in the state field

states:
  - id: evaluated
    label: Evaluated
    aliases: [evaluada]
    description: Role reviewed, report created, pending decision
    dashboard_group: evaluated

  - id: apply-next
    label: Apply Next
    aliases: [apply_next, apply-next, ready_to_apply]
    description: Strong target, should be prioritized for application work
    dashboard_group: apply-next

  - id: applied
    label: Applied
    aliases: [aplicado, enviada, aplicada, sent]
    description: Application submitted
    dashboard_group: applied

  - id: responded
    label: Responded
    aliases: [respondido]
    description: Company replied, not yet formal interview stage
    dashboard_group: responded

  - id: interview
    label: Interview
    aliases: [entrevista]
    description: Active interview process
    dashboard_group: interview

  - id: offer
    label: Offer
    aliases: [oferta]
    description: Offer received
    dashboard_group: offer

  - id: rejected
    label: Rejected
    aliases: [rechazado, rechazada]
    description: Rejected by company
    dashboard_group: rejected

  - id: discarded
    label: Discarded
    aliases: [descartado, descartada, cerrada, cancelada]
    description: Discarded by candidate or role closed
    dashboard_group: discarded

  - id: skip
    label: Skip
    aliases: [no_aplicar, no aplicar, skip, monitor]
    description: Not a role worth applying to
    dashboard_group: skip
