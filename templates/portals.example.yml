# Job-Finder Portal Scanner Configuration
# Copy to `portals.yml` and customize further.
#
# Goal of this default:
# - favor practical, high-leverage roles
# - include AI/product/solutions/automation/operator tracks
# - avoid junk roles and obvious mismatch stacks

title_filter:
  positive:
    # AI / automation / systems
    - "AI"
    - "GenAI"
    - "LLM"
    - "Agent"
    - "Agentic"
    - "Automation"
    - "Applied AI"
    - "AI Product"
    - "AI Solutions"
    - "AI Operations"
    - "Business Systems"
    - "Internal Tools"
    - "RevOps"
    - "GTM Engineer"
    - "Growth Engineer"
    - "Solutions Engineer"
    - "Solutions Architect"
    - "Implementation"
    - "Customer Engineer"
    - "Product Manager"
    - "Technical Product Manager"
    - "Operations"
    - "Systems"
  negative:
    - "Junior"
    - "Intern"
    - ".NET"
    - "Java "
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Mainframe"
    - "COBOL"
    - "Salesforce Admin"
    - "SAP "
    - "Oracle EBS"
    - "Account Executive"
    - "SDR"
    - "BDR"
  seniority_boost:
    - "Senior"
    - "Lead"
    - "Principal"
    - "Staff"
    - "Head"
    - "Director"

search_queries:
  - name: Ashby — AI Product / Automation
    query: 'site:jobs.ashbyhq.com "AI Product" OR "Automation" OR "Applied AI" remote'
    enabled: true

  - name: Ashby — Solutions / Implementation
    query: 'site:jobs.ashbyhq.com "Solutions Engineer" OR "Solutions Architect" OR "Implementation" remote'
    enabled: true

  - name: Ashby — RevOps / Systems / GTM Engineer
    query: 'site:jobs.ashbyhq.com "RevOps" OR "Business Systems" OR "GTM Engineer" OR "Internal Tools" remote'
    enabled: true

  - name: Greenhouse — AI Product / Ops
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "AI Product Manager" OR "Product Operations" OR "Applied AI" remote'
    enabled: true

  - name: Greenhouse — Solutions / Customer / Implementation
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Solutions Engineer" OR "Customer Engineer" OR "Implementation Manager" remote'
    enabled: true

  - name: Greenhouse — Automation / Business Systems
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Automation" OR "Business Systems" OR "RevOps" remote'
    enabled: true

  - name: Lever — AI / Automation / Product
    query: 'site:jobs.lever.co "AI" OR "Automation" OR "Product Manager" remote'
    enabled: true

  - name: Lever — Solutions / Implementation
    query: 'site:jobs.lever.co "Solutions" OR "Implementation" OR "Customer Engineer" remote'
    enabled: true

  - name: Cross-portal — GTM systems / Ops builder
    query: '"GTM Engineer" OR "RevOps Engineer" OR "Growth Engineer" OR "Business Systems" automation remote'
    enabled: true

  - name: Cross-portal — AI operations / operator roles
    query: '"Applied AI" OR "AI Operations" OR "AI Program" OR "AI Product" remote'
    enabled: true

tracked_companies:
  - name: OpenAI
    careers_url: https://openai.com/careers
    scan_method: websearch
    scan_query: 'site:openai.com/careers "product" OR "solutions" OR "operations" OR "ai"'
    enabled: true

  - name: Anthropic
    careers_url: https://job-boards.greenhouse.io/anthropic
